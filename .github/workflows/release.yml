name: release

# Builds the desktop app (its own window, no browser) for Windows, Linux and macOS, tests each build by starting it,
# and publishes them as a GitHub release.
#   * push a tag (git tag v0.3.0 && git push origin v0.3.0)           -> release for that tag
#   * or run this workflow by hand with the tag to create             -> the tag is created at the chosen commit
#     (untick "publish" to only build and test: the files stay in the run's artifacts)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to create (for example v0.3.0)'
        required: true
      publish:
        description: 'Publish the release (untick to only build and test)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, build: '--win nsis portable' }
          - { os: ubuntu-latest, name: linux-x64, build: '--linux AppImage deb' }
          - { os: macos-latest, name: macos-arm64, build: '--mac zip' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/desktop/package-lock.json
      - name: Install the web app's tools
        run: npm ci
        working-directory: web
      - name: Unit tests
        if: matrix.os == 'ubuntu-latest'
        run: npm test
        working-directory: web
      - name: Install the desktop shell
        run: npm ci
        working-directory: web/desktop
      - name: Build the app and package it
        run: |
          node prepare.mjs
          npx electron-builder ${{ matrix.build }} --publish never
        working-directory: web/desktop
      - name: Test the packaged app (starts it, plays the demo, checks that sound comes out)
        working-directory: web/desktop
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) sudo apt-get update -qq && sudo apt-get install -y -qq xvfb && xvfb-run -a -s "-screen 0 1600x1000x24" node smoke.mjs out/linux-unpacked/fl-lua-desktop ;;
            windows-latest) node smoke.mjs "out/win-unpacked/FL LUA.exe" ;;
            macos-latest) node smoke.mjs "$(ls -d out/mac*/*.app | head -1)/Contents/MacOS/FL LUA" ;;
          esac
      - name: Test the Windows installer (silent per-user install, then start the installed app)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: web/desktop
        run: |
          Start-Process -FilePath "out\FL-LUA-windows-x64-setup.exe" -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "FL LUA.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "the installer did not install FL LUA.exe"; exit 1 }
          Write-Output "installed: $($exe.FullName)"
          node smoke.mjs "$($exe.FullName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the .deb (install with apt, then start the installed app)
        if: matrix.os == 'ubuntu-latest'
        working-directory: web/desktop
        run: |
          sudo apt-get install -y -qq ./out/FL-LUA-linux-x64.deb
          xvfb-run -a -s "-screen 0 1600x1000x24" node smoke.mjs "/opt/FL LUA/fl-lua-desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          # the update files (latest*.yml, .blockmap) let installed copies update themselves
          path: |
            web/desktop/out/FL-LUA-*
            web/desktop/out/latest*.yml
          if-no-files-found: error

  publish:
    needs: desktop
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the release files
        run: |
          mkdir -p out
          cp artifacts/app-windows-x64/* artifacts/app-linux-x64/* out/
          cp artifacts/app-macos-arm64/FL-LUA-macos-arm64.zip out/
          for f in FL-LUA-windows-x64.exe FL-LUA-windows-x64-setup.exe latest.yml FL-LUA-linux-x64.AppImage FL-LUA-linux-x64.deb latest-linux.yml FL-LUA-macos-arm64.zip; do test -f "out/$f" || { echo "missing $f"; exit 1; }; done
          (cd web && npm ci && npm run build && cd dist && zip -qr ../../out/FL-LUA-web.zip .)
          # the plugin packs are also published on their own, with the catalog the Plugin store reads (Plugin store -> Add catalog)
          cp web/packs/*.flpack.js web/packs/catalog.json out/
          ls -la out
      - name: Create the release
        run: |
          sed "s/__TAG__/$TAG/g" .github/release-notes.md > notes.md
          gh release create "$TAG" out/* \
            --title "FL LUA $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --verify-tag=false
