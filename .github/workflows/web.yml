name: web

on:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - name: Unit tests (engine, effects, instruments, Patcher, audio editor, formats)
        run: npm test

      - name: Install Chromium for the browser tests
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: End-to-end tests (real Chromium, real AudioWorklet)
        run: node tests/e2e/run.mjs

      - name: Production build + smoke test of the minified app
        run: |
          npm run build
          E2E_ROOT=dist node tests/e2e/run.mjs basic

      - uses: actions/upload-artifact@v4
        with:
          name: fl-lua-web
          path: web/dist/
